spring:
  application:
    name: friendlog-server

  # 로컬은 compose.yaml의 MySQL에 접속. 운영은 6단계에서 환경 변수(DB_URL 등)로 덮어쓴다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/friendlog?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:friendlog}
    password: ${DB_PASSWORD:friendlog}

  # 테이블은 Flyway가 db/migration의 SQL로 만든다.
  # Hibernate는 엔티티와 테이블이 맞는지 검사만 하고(validate), 다르면 앱이 뜨지 않는다.
  jpa:
    hibernate:
      ddl-auto: validate
