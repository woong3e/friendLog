spring:
  application:
    name: friendlog-server

  # 로컬은 compose.yaml의 MySQL에 접속. 운영은 6단계에서 환경 변수(DB_URL 등)로 덮어쓴다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/friendlog?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:friendlog}
    password: ${DB_PASSWORD:friendlog}

  # 테이블은 Flyway가 db/migration의 SQL로 만든다.
  # Hibernate는 엔티티와 테이블이 맞는지 검사만 하고(validate), 다르면 앱이 뜨지 않는다.
  jpa:
    hibernate:
      ddl-auto: validate
    # DB 연결을 트랜잭션(서비스) 안에서만 쓰고 바로 반납한다.
    # 그래서 LAZY 연관관계는 서비스 안에서 DTO로 바꿀 때 읽어야 한다.
    open-in-view: false

  # 인증 메일 발송. 로컬은 compose의 Mailpit(가짜 메일 서버, http://localhost:8025 에서 확인)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

friendlog:
  auth:
    # HMAC 서명 키 (32바이트 이상, 길이에 따라 HS256/384/512가 정해짐). 기본값은 로컬 전용 — 운영은 반드시 환경 변수로
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-in-production-0123456789}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    # 로컬(http)에서는 Secure 쿠키를 쓸 수 없어서 false. 운영(https)은 true
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  signup:
    code-ttl: 10m           # 인증 코드 유효 시간
    resend-cooldown: 60s    # 재전송 간격
    max-attempts: 5         # 틀릴 수 있는 횟수
    mail-from: ${MAIL_FROM:FRIENDLOG <no-reply@wondang.xyz>}
